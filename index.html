<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--blip:#0096FA;--blip-2:#00C2FF;--bg:#05080F;--text:#E8EDF7;--dim:#8893A8;--mute:#5D6679;--client:#E3B778}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Lexend,sans-serif;color:var(--text);background:var(--bg);
background-image:radial-gradient(1000px 600px at 85% -10%,rgba(0,150,250,.18),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(0,194,255,.08),transparent 60%)}
.g{width:min(420px,100%);padding:40px 34px;border-radius:24px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(17,24,43,.9),rgba(10,15,28,.7));box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center;animation:in .7s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.b{width:52px;height:52px;margin:0 auto 20px;border-radius:15px;background:linear-gradient(135deg,var(--blip),var(--blip-2));display:flex;align-items:center;justify-content:center;color:#04121f;font-weight:900;font-size:24px;box-shadow:0 0 40px rgba(0,150,250,.45)}
.e{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--blip)}
h1{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:10px 0 6px}h1 span{color:var(--client)}
p{font-size:13.5px;color:var(--dim);font-weight:300;margin-bottom:24px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(0,150,250,.3);background:rgba(5,8,15,.7);color:var(--text);font-family:inherit;font-size:15px;outline:none;text-align:center;letter-spacing:2px;transition:.25s}
input:focus{border-color:var(--blip);box-shadow:0 0 0 3px rgba(0,150,250,.18)}
button{width:100%;margin-top:12px;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--blip),#0078C8);color:#fff;font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer;box-shadow:0 10px 30px rgba(0,150,250,.3)}
.err{min-height:20px;margin-top:12px;font-size:12.5px;color:#FF6B6B}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.f{margin-top:22px;font-size:10.5px;color:var(--mute);font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
</style></head><body>
